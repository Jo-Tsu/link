name: Bug report
description: Report a reproducible problem in Smallink
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Smallink. Remove tokens, private paths, and raw conversation content before attaching logs or screenshots.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS desktop client
        - Local sidecar / API
        - Agent runtime and tools
        - Memory and data governance
        - MineM application / connector
        - Automation and run center
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: App version or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, CPU architecture, installation type
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only the smallest useful log excerpt. Never include credentials or raw personal data.
