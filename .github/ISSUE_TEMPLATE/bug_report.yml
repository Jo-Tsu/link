name: Bug report
description: Report a reproducible problem in Link or LinkAgent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Link. Remove tokens, private paths, and raw conversation content before attaching logs or screenshots.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Link Web / platform API
        - LinkAgent
        - Codex connector
        - Web crawler
        - Docker / deployment
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.1 Developer Preview or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, CPU architecture, Docker version, browser
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only the smallest useful log excerpt. Never include credentials or raw personal data.
