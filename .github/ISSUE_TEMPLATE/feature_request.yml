name: Feature request
description: Propose a Smallink capability grounded in a real workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        A strong proposal explains the user problem, capability boundary, source data, permissions, and observable result before suggesting implementation details.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What cannot be done today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the successful workflow from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Agent and multi-agent collaboration
        - Memory and data governance
        - New application or connector
        - Desktop interaction
        - Automation and run center
        - Model provider and tools
        - Developer experience
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source and authorization boundary
      description: Explain where the data lives, what Smallink should access, and what the user should authorize.
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Add sanitized examples, comparable workflows, or links that clarify the need.
