[package]
name = "smallink-desktop"
version = "0.1.0"
description = "Smallink desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "smallink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Kept outside the Tauri shell so another Smallink surface can reuse the same local STT engine.
smallink-stt = { path = "../../../stt" }
